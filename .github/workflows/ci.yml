name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Every test on this runner (lint, fmt, clippy, cargo test, release build)
        run: ./dialtone.sh test --here

  cross-platform-matrix:
    needs: test-and-verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The test suite (unit, one node, three nodes, self-update)
        shell: bash
        run: ./dialtone.sh test --here --only suite
