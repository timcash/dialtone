name: Release Pre-Compiled Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bin_name: dialtone
            asset_name: dialtone-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: dialtone
            asset_name: dialtone-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: dialtone.exe
            asset_name: dialtone-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage release asset
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "${{ matrix.asset_name }}"
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
