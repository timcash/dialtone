name: Release Pre-Compiled Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Every step that does work is one ./dialtone.sh call (Git Bash on Windows).
defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Every test on this runner (lint, fmt, clippy, cargo test, release build)
        run: ./dialtone.sh test --here

  build-and-release:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binary and its SHA-256 (target/release-assets)
        run: ./dialtone.sh release build ${{ matrix.target }}
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/release-assets/
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release-assets/*

  # Nodes update themselves only to binaries listed in a manifest signed with the release key
  # (src/update.rs holds its public key), whether they get them from here or from a peer.
  manifest:
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          path: target/release-assets
          merge-multiple: true
      - name: Sign the release manifest (the tag must be the Cargo.toml version)
        env:
          DIALTONE_RELEASE_KEY: ${{ secrets.DIALTONE_RELEASE_KEY }}
        run: ./dialtone.sh release manifest
      - name: Upload the manifest to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release-assets/dialtone-release.json
            target/release-assets/dialtone-release.json.sig
