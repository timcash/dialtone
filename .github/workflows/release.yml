name: Release Pre-Compiled Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Dialtone CI/CD & Zero-Leak Gate
        run: ./dialtone.sh test --here

  build-and-release:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bin_name: dialtone
            asset_name: dialtone-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin_name: dialtone
            asset_name: dialtone-linux-x86_64
            install_musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin_name: dialtone
            asset_name: dialtone-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: dialtone.exe
            asset_name: dialtone-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools
        if: matrix.install_musl == true
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary (size-optimized dist profile)
        run: cargo build --profile dist --target ${{ matrix.target }}
      - name: Stage release asset & SHA-256 digest
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/dist/${{ matrix.bin_name }}" "${{ matrix.asset_name }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi
          cat "${{ matrix.asset_name }}.sha256"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  # Nodes update themselves only to binaries listed in a manifest signed with the release key
  # (src/update.rs holds its public key), whether they get them from here or from a peer.
  manifest:
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Sign the release manifest
        env:
          DIALTONE_RELEASE_KEY: ${{ secrets.DIALTONE_RELEASE_KEY }}
        run: cargo xtask release-manifest "${GITHUB_REF_NAME#v}" assets
      - name: Upload the manifest to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/dialtone-release.json
            assets/dialtone-release.json.sig
