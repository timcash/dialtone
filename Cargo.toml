[package]
name = "dialtone"
version = "0.5.1"
edition = "2021"
description = "Dialtone — Single-binary Iroh 1.3 mesh control plane, content-addressed deployment, process supervision, and operational evidence runtime"
license = "MIT OR Apache-2.0"

# xtask/ holds the dev tasks (`cargo xtask ...`, or ./dialtone.sh): lint, check, deploy, fleet
# and the scale tests. Plain `cargo build` / `cargo test` build only dialtone.
[workspace]
members = ["xtask"]
default-members = ["."]

[lib]
# No doc examples to run; skipping doctest builds saves a compile on every `cargo test`.
doctest = false

[[bin]]
name = "dialtone"
path = "src/main.rs"
# main.rs has no unit tests; its empty test harness would compile the binary a second time.
test = false

# `--release` is the everyday optimized build used by `./dialtone.sh test`, GitHub CI and deploys:
# no LTO and parallel, incremental codegen, so a one-file change rebuilds in seconds.
[profile.release]
opt-level = 2
lto = false
codegen-units = 16
incremental = true
panic = "abort"
strip = "symbols"

# Tests start real nodes from the debug binary; Argon2id key derivation (once per node) is
# far too slow unoptimized.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# ... and so is hashing a binary as large as a debug build (the self-update tests).
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.bao-tree]
opt-level = 3

# Published binaries (release.yml): smallest size, built only when a version is tagged.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
incremental = false

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "std"] }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "std"] }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
form_urlencoded = { version = "1.2.2", default-features = false, features = ["std"] }
futures-lite = { version = "2", default-features = false, features = ["std"] }
httparse = { version = "1.10.1", default-features = false, features = ["std"] }
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring", "fast-apple-datapath", "metrics"] }
iroh-blobs = { version = "0.103.1", default-features = false, features = ["fs-store"] }
iroh-gossip = { version = "0.101.0", default-features = false, features = ["net", "metrics"] }
iroh-mainline-address-lookup = { version = "0.6.0", default-features = false }
iroh-mdns-address-lookup = { version = "0.6.0", default-features = false }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.190", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

