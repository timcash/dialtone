[package]
name = "dialtone"
version = "0.2.0"
edition = "2021"
description = "Dialtone — Single-binary Iroh 1.3 mesh control plane, content-addressed deployment, process supervision, and operational evidence runtime"
license = "MIT OR Apache-2.0"

[lib]
# No doc examples to run; skipping doctest builds saves a compile on every `cargo test`.
doctest = false

[[bin]]
name = "dialtone"
path = "src/main.rs"
# main.rs has no unit tests; its empty test harness would compile the binary a second time.
test = false

# `--release` is the everyday optimized build used by ci.sh, GitHub CI and fleet deploys:
# no LTO and parallel, incremental codegen, so a one-file change rebuilds in seconds.
[profile.release]
opt-level = 2
lto = false
codegen-units = 16
incremental = true
panic = "abort"
strip = "symbols"

# Published binaries (release.yml): smallest size, built only when a version is tagged.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
incremental = false

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "std"] }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "std"] }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
form_urlencoded = { version = "1.2.2", default-features = false, features = ["std"] }
futures-lite = { version = "2", default-features = false, features = ["std"] }
httparse = { version = "1.10.1", default-features = false, features = ["std"] }
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
iroh-blobs = { version = "0.103.1", default-features = false, features = ["fs-store"] }
iroh-gossip = { version = "0.101.0", default-features = false, features = ["net"] }
iroh-mainline-address-lookup = { version = "0.6.0", default-features = false }
iroh-mdns-address-lookup = { version = "0.6.0", default-features = false }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.190", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

